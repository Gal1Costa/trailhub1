name: Playwright E2E Tests

on:
  push:
    branches: [ Development ]
  pull_request:
    branches: [ Development ]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    permissions:
      checks: write
      pull-requests: write
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.CI_DATABASE_URL }}" ]; then
            echo "❌ Error: CI_DATABASE_URL secret is not set"
            echo "Please add CI_DATABASE_URL secret in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.CI_ADMIN_UIDS }}" ]; then
            echo "❌ Error: CI_ADMIN_UIDS secret is not set"
            echo "Please add CI_ADMIN_UIDS secret in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Create backend .env for CI
        shell: bash
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=3000
          DATABASE_URL=${{ secrets.CI_DATABASE_URL }}
          ADMIN_UIDS=${{ secrets.CI_ADMIN_UIDS }}
          EOF

      - name: Build backend Docker image
        shell: bash
        run: |
          docker compose version || echo "Docker Compose plugin ready"
          # Build backend image to ensure latest dependencies are included
          # --build flag ensures image is rebuilt if package.json changed
          docker compose -f docker-compose.yml build backend

      - name: Bring up services (Postgres + Backend)
        shell: bash
        run: |
          docker compose -f docker-compose.yml up -d db backend

      - name: Wait for backend health
        shell: bash
        run: |
          echo "Waiting for backend health at http://localhost:3000/healthz"
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "Backend is healthy"; exit 0;
            fi
            sleep 2;
          done
          echo "Backend did not become healthy in time"; exit 1

      - name: Test Prisma migrations
        shell: bash
        run: |
          # Convert DATABASE_URL from Docker hostname (db) to localhost for runner
          # The migration test runs on GitHub Actions runner, not in Docker container
          DB_URL="${{ secrets.CI_DATABASE_URL }}"
          # Replace 'db:' or '@db:' with 'localhost:' for connection from runner
          DB_URL="${DB_URL/@db:/@localhost:}"
          DB_URL="${DB_URL/db:/localhost:}"
          echo "Running migrations with: ${DB_URL}"
          DATABASE_URL="${DB_URL}" npx prisma migrate deploy

      - name: API validation (if script present)
        shell: bash
        env:
          BASE_URL: http://localhost:3000
        run: |
          if [ -x ./test_api.sh ]; then
            echo "Running test_api.sh against ${BASE_URL}"
            ./test_api.sh
          else
            echo "test_api.sh not found, skipping"
          fi

      - name: Security audit (backend)
        run: npm audit --audit-level=high
      
      - name: Install dependencies (frontend)
        working-directory: ./frontend
        run: npm ci
      
      - name: Security audit (high severity)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        working-directory: ./frontend
        run: |
          # Install system dependencies required by Playwright browsers
          # This ensures WebKit has all required libraries (like libwoff2dec)
          npx playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Build verification
        working-directory: ./frontend
        shell: bash
        run: |
          export VITE_API_URL="http://localhost:3000"
          npm run build
      
      - name: Start frontend (vite preview)
        working-directory: ./frontend
        run: |
          nohup npm run preview -- --host --port 5173 > preview.log 2>&1 &
          echo $! > preview.pid
        env:
          VITE_API_URL: http://localhost:3000
      
      - name: Wait for server to start
        working-directory: ./frontend
        run: |
          npx wait-on http://localhost:5173 --timeout 60000 --interval 1000 --verbose
          echo "Server is ready at http://localhost:5173"
      
      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: true
      
      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Services ==="
          docker compose ps || true
          echo "=== Backend Logs ==="
          docker compose logs backend || true
          echo "=== Database Logs ==="
          docker compose logs db || true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: frontend/playwright-report/
          retention-days: 30
      
      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: frontend/test-results/
          retention-days: 30
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            frontend/test-results/results.xml
          check_name: Playwright Test Results
          comment_mode: always

      - name: Cleanup - Stop services and frontend
        if: always()
        shell: bash
        run: |
          echo "🧹 Cleaning up services..."
          # Stop frontend preview server if running
          if [ -f frontend/preview.pid ]; then
            PID=$(cat frontend/preview.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "Stopping frontend preview server (PID: $PID)"
              kill $PID || true
            fi
            rm -f frontend/preview.pid || true
          fi
          # Stop Docker Compose services
          echo "Stopping Docker Compose services..."
          docker compose -f docker-compose.yml down -v || true
          echo "✅ Cleanup complete"

  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to Development branch (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/Development'
    
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "❌ Error: DEPLOY_SSH_KEY secret is not set"
            echo "Please add DEPLOY_SSH_KEY secret in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "❌ Error: DEPLOY_HOST secret is not set"
            echo "Please add DEPLOY_HOST secret in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All deployment secrets are set"

      - name: Setup SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key - handle both single-line and multi-line formats
          # Remove any leading/trailing whitespace and ensure proper line endings
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verify key exists and has content
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "❌ Error: SSH key file is empty"
            exit 1
          fi
          
          # Check key format (try to read it)
          KEY_START=$(head -c 30 ~/.ssh/deploy_key)
          if [[ ! "$KEY_START" =~ "BEGIN" ]] && [[ ! "$KEY_START" =~ "ssh-" ]]; then
            echo "⚠️ Warning: Key might not be in standard format"
            echo "Key starts with: $KEY_START"
          fi
          
          # Try to validate key format (this might fail for some key types, that's OK)
          ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null 2>&1 || echo "⚠️ Key format validation skipped (this is OK for some key types)"
          
          # Add server to known_hosts
          ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          
          echo "✅ SSH key configured and validated"
          
          # Test SSH connection
          echo "🔍 Testing SSH connection..."
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${DEPLOY_USER}@${DEPLOY_HOST} "echo 'SSH connection successful'" 2>&1; then
            echo "✅ SSH connection test passed"
          else
            echo "⚠️ SSH connection test failed, but continuing..."
            echo "This might be normal if the server requires additional setup"
          fi

      - name: Deploy to server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/trailhub1' }}
        run: |
          echo "🚀 Starting deployment to ${DEPLOY_HOST}..."
          echo "📂 Using deployment path: ${DEPLOY_PATH}"
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} bash -s << ENDSSH
            set -e
            DEPLOY_PATH="${DEPLOY_PATH}"
            echo "📂 Navigating to project directory: \${DEPLOY_PATH}..."
            cd "\${DEPLOY_PATH}" || { echo "❌ Project directory not found at \${DEPLOY_PATH}!"; exit 1; }
            
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/Development
            git clean -fd
            
            echo "🔧 Pulling latest Docker images..."
            docker compose pull || true
            
            echo "🏗️ Building and starting containers..."
            docker compose up -d --build
            
            echo "⏳ Waiting for database to be ready..."
            # Wait for database to accept connections
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U trailhub >/dev/null 2>&1; then
                echo "✅ Database is ready"
                break
              fi
              echo "Waiting for database... (attempt $i/30)"
              sleep 2
            done
            
            echo "⏳ Waiting for backend container to be ready..."
            # Wait for backend container to be running
            for i in {1..30}; do
              if docker compose ps backend | grep -q "Up"; then
                echo "✅ Backend container is running"
                break
              fi
              echo "Waiting for backend container... (attempt $i/30)"
              sleep 2
            done
            
            # Give backend a moment to fully initialize
            sleep 5
            
            echo "🔄 Running database migrations..."
            # Run migrations inside the backend container where DATABASE_URL resolves correctly
            if docker compose exec -T backend sh -c "npx prisma migrate deploy"; then
              echo "✅ Migrations completed successfully"
            else
              echo "⚠️ Migration command failed, checking status..."
              docker compose exec -T backend sh -c "npx prisma migrate status" || true
              echo "⚠️ Continuing deployment despite migration warning..."
            fi
            
            echo "📊 Checking container status..."
            docker compose ps
            
            echo "✅ Deployment complete!"
          ENDSSH

      - name: Verify deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/trailhub1' }}
        run: |
          echo "🔍 Verifying deployment health..."
          
          # Wait a bit for services to fully start
          sleep 15
          
          # Check backend health
          BACKEND_URL="http://${DEPLOY_HOST}:3000/healthz"
          echo "Checking backend at ${BACKEND_URL}..."
          
          for i in {1..10}; do
            if curl -fsS --max-time 5 "${BACKEND_URL}" >/dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/10)"
            sleep 3
          done
          
          echo "⚠️ Backend health check failed, but deployment completed"
          echo "Please check server logs manually: ssh ${DEPLOY_USER}@${DEPLOY_HOST} 'cd ${DEPLOY_PATH} && docker compose logs'"